<style>
  /* ============================================================
     THEME TOKENS — 黒×白のモノトーン。ダークがデフォルト、
     OS側がライト指定の場合のみ反転する。
     ============================================================ */
  :root {
    --bg: #000000;
    --surface: #000000;
    --surface-2: #141414;
    --border: #333333;
    --text-primary: #ffffff;
    --text-secondary: #999999;
    --text-muted: #666666;
    --accent: #ffffff;
    --accent-bg: #1a1a1a;
    --accent2: #d1a35c;
    --accent2-bg: rgba(209, 163, 92, 0.14);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #ffffff;
      --surface: #ffffff;
      --surface-2: #f2f2f2;
      --border: #cccccc;
      --text-primary: #000000;
      --text-secondary: #555555;
      --text-muted: #888888;
      --accent: #000000;
      --accent-bg: #ededed;
      --accent2: #a3742a;
      --accent2-bg: rgba(163, 116, 42, 0.1);
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000;
    --surface: #000000;
    --surface-2: #141414;
    --border: #333333;
    --text-primary: #ffffff;
    --text-secondary: #999999;
    --text-muted: #666666;
    --accent: #ffffff;
    --accent-bg: #1a1a1a;
    --accent2: #d1a35c;
    --accent2-bg: rgba(209, 163, 92, 0.14);
  }

  /* ============================================================
     BASE / LAYOUT
     ============================================================ */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: "SF Mono", "JetBrains Mono", "Menlo", "Consolas",
      "Hiragino Sans", "Yu Gothic Medium", "Yu Gothic", sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  #app {
    width: 100%;
    max-width: 420px;
    min-height: 100vh;
    padding: 24px 20px 60px;
    overflow-x: auto;
  }
  @media (min-width: 640px) {
    body {
      align-items: center;
      padding: 48px 20px;
      background:
        radial-gradient(circle at 15% 20%, rgba(209, 163, 92, 0.08), transparent 42%),
        radial-gradient(circle at 85% 75%, rgba(209, 163, 92, 0.05), transparent 45%),
        var(--bg);
    }
    #app {
      min-height: auto;
      max-height: 880px;
      overflow-y: auto;
      border: 0.5px solid var(--border);
      border-radius: 26px;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.55);
    }
  }
  h1, h2, h3 { font-weight: 500; margin: 0; }
  p { margin: 0; line-height: 1.6; }
  button {
    font-family: inherit;
    cursor: pointer;
    border: 0.5px solid var(--border);
    background: var(--surface);
    color: var(--text-primary);
    border-radius: 10px;
    transition: background 0.15s, transform 0.1s;
  }
  button:active { transform: scale(0.98); }
  button:disabled {
    opacity: 0.4; cursor: not-allowed; pointer-events: none;
  }
  button:disabled:active { transform: none; }
  .screen { display: flex; flex-direction: column; gap: 20px; animation: screenIn 0.2s ease; }
  @keyframes screenIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .topbar { display: flex; align-items: center; gap: 12px; }
  .back-btn {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; padding: 0; flex-shrink: 0;
  }
  .logo {
    font-size: 11px; letter-spacing: 0.1em; color: var(--text-secondary);
    background: var(--surface); border: 0.5px solid var(--border); border-radius: 20px;
    padding: 6px 14px 6px 10px; cursor: pointer; font-family: inherit;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .logo:active { background: var(--surface-2); color: var(--text-primary); }
  .home-icon { flex-shrink: 0; }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6);
    display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 24px;
  }
  .modal-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 14px; padding: 20px; max-width: 320px; width: 100%; }
  .modal-text { font-size: 13px; color: var(--text-primary); line-height: 1.6; margin-bottom: 16px; text-align: center; }
  .modal-actions { display: flex; gap: 10px; }
  .modal-cancel { flex: 1; padding: 12px 0; font-size: 13px; }
  .modal-confirm { flex: 1; padding: 12px 0; font-size: 13px; background: var(--accent); color: var(--bg); border: none; }

  /* ============================================================
     SHARED COMPONENTS
     ============================================================ */
  .card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 14px;
    padding: 18px;
  }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-card { background: var(--surface-2); border-radius: 12px; padding: 14px; }
  .stat-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .stat-value { font-size: 20px; font-weight: 500; }
  .nav-list { display: flex; flex-direction: column; gap: 10px; }
  .nav-item { display: flex; align-items: center; gap: 14px; padding: 16px 14px; text-align: left; width: 100%; }
  .nav-item:disabled { opacity: 0.4; cursor: default; }
  .row-arrow { color: var(--text-muted); font-size: 16px; margin-left: auto; flex-shrink: 0; }
  .nav-title { font-size: 14px; font-weight: 500; }
  .nav-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .progress { display: flex; gap: 4px; }
  .dot { height: 4px; border-radius: 2px; flex: 1; background: var(--border); }
  .dot.active { background: var(--accent2); }
  .q-title { font-size: 17px; font-weight: 500; text-align: center; margin: 8px 0 4px; }
  .q-count { font-size: 12px; color: var(--text-muted); text-align: center; }
  .option-btn { padding: 14px 16px; text-align: left; font-size: 14px; display: flex; align-items: center; gap: 10px; }
  .option-btn:hover { background: var(--surface-2); }
  .result-tagline { font-size: 12px; color: var(--text-secondary); text-align: center; margin-top: -8px; }
  .drink-card { padding: 14px; border-radius: 12px; }
  .drink-card.best { border: 1.5px solid var(--accent2); }
  .badge {
    display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 6px;
    background: var(--accent2-bg); color: var(--accent2); margin-bottom: 6px;
  }
  .drink-name { font-size: 15px; font-weight: 500; margin-bottom: 3px; }
  .drink-line { font-size: 12px; color: var(--text-secondary); }
  .info-box {
    background: var(--surface-2); border-radius: 12px; padding: 14px;
    font-size: 12px; color: var(--text-secondary); line-height: 1.7;
  }
  .info-label { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; letter-spacing: 0.05em; }
  .trait-row + .trait-row { margin-top: 14px; }
  .trait-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; }
  .trait-track { position: relative; height: 3px; background: var(--border); border-radius: 2px; }
  .trait-dot { position: absolute; top: 50%; width: 11px; height: 11px; border-radius: 50%; background: var(--accent); transform: translate(-50%, -50%); }
  .trait-divider { border-top: 0.5px solid var(--border); margin: 14px 0; }
  .trivia-quote {
    border-left: 2px solid var(--border); padding-left: 12px;
    font-size: 12px; color: var(--text-secondary); line-height: 1.7;
  }
  .more-toggle {
    background: none; border: none; padding: 4px 0 0 12px; font-size: 12px;
    color: var(--accent2); text-align: left;
  }
  .trivia-section { font-size: 12px; color: var(--text-secondary); line-height: 1.7; }
  .trivia-section + .trivia-section { margin-top: 12px; }
  .trivia-section-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; letter-spacing: 0.05em; }
  .swatch { flex-shrink: 0; border: 0.5px solid var(--border); }
  /* グラスの形(サイズ非依存の形状) */
  .glass-rock { border-radius: 2px 2px 6px 6px; }
  .glass-highball { border-radius: 2px 2px 4px 4px; }
  .glass-coupe { clip-path: polygon(0% 0%, 100% 0%, 58% 62%, 58% 100%, 42% 100%, 42% 62%); }
  .glass-mug { border-radius: 3px 3px 8px 8px; position: relative; }
  .glass-cup { border-radius: 50% 50% 45% 45%; }
  .swatch-lg.glass-mug::after {
    content: ""; position: absolute; right: -8px; top: 6px; width: 8px; height: 12px;
    border: 2px solid var(--border); border-left: none; border-radius: 0 8px 8px 0;
  }
  /* 詳細画面用の大きいサイズ */
  .swatch-lg.glass-rock { width: 30px; height: 28px; }
  .swatch-lg.glass-highball { width: 18px; height: 44px; }
  .swatch-lg.glass-coupe { width: 40px; height: 34px; }
  .swatch-lg.glass-mug { width: 26px; height: 30px; }
  .swatch-lg.glass-cup { width: 32px; height: 22px; }
  /* 凡例用の中間サイズ */
  .swatch-md.glass-rock { width: 20px; height: 24px; }
  .swatch-md.glass-highball { width: 13px; height: 30px; }
  .swatch-md.glass-coupe { width: 24px; height: 26px; }
  .swatch-md.glass-mug { width: 18px; height: 22px; }
  /* 一覧行用の小さいサイズ */
  .swatch-sm.glass-rock { width: 14px; height: 18px; border-radius: 1px 1px 4px 4px; }
  .swatch-sm.glass-highball { width: 9px; height: 22px; }
  .swatch-sm.glass-coupe { width: 16px; height: 20px; }
  .swatch-sm.glass-mug { width: 13px; height: 18px; border-radius: 1px 1px 4px 4px; }
  .swatch-sm.glass-cup { width: 16px; height: 12px; }
  .carb-badge {
    display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 5px;
    border: 0.5px solid var(--border); color: var(--text-muted); flex-shrink: 0;
  }
  .untried-badge {
    display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 5px;
    border: 0.5px solid var(--accent2); color: var(--accent2); flex-shrink: 0;
  }
  .legend-row { display: flex; gap: 16px; justify-content: center; padding: 2px 0 4px; }
  .legend-item { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .legend-label { font-size: 11px; color: var(--text-secondary); }
  .search-input {
    width: 100%; padding: 12px 14px; font-size: 14px; font-family: inherit;
    background: var(--surface); color: var(--text-primary);
    border: 0.5px solid var(--border); border-radius: 10px;
  }
  .search-input::placeholder { color: var(--text-muted); }
  .tab-row { display: flex; gap: 8px; }
  .tab-btn { flex: 1; padding: 10px 0; font-size: 13px; }
  .tab-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 9px 14px; font-size: 12px; border-radius: 20px; }
  .chip.active { background: var(--accent2-bg); color: var(--accent2); border-color: var(--accent2); font-weight: 600; }
  .filter-group { margin-top: 10px; }
  .filter-group-label { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
  .filter-reset { font-size: 12px; color: var(--text-secondary); padding: 6px 0; background: none; border: none; text-decoration: underline; }
  .badge-chip {
    display: inline-block; font-size: 11px; padding: 5px 12px; border-radius: 20px;
    border: 0.5px solid var(--border);
  }
  .badge-chip.earned { background: var(--accent2-bg); color: var(--accent2); border-color: var(--accent2); }
  .badge-chip.locked { color: var(--text-muted); }
  .badge-chip.rank-bronze.earned { background: rgba(176, 141, 87, 0.16); color: #cf9f6e; border-color: #b08d57; }
  .badge-chip.rank-silver.earned { background: rgba(201, 205, 212, 0.14); color: #d7dade; border-color: #9ea3ab; }
  .badge-chip.rank-gold.earned { background: var(--accent2-bg); color: var(--accent2); border-color: var(--accent2); box-shadow: 0 0 10px rgba(209, 163, 92, 0.35); }
  .rank-summary {
    display: inline-block; font-size: 11px; padding: 3px 10px; border-radius: 8px; margin-left: 8px;
  }
  .rank-summary.rank-見習い { color: var(--text-muted); border: 0.5px solid var(--border); }
  .rank-summary.rank-ブロンズ { color: #cf9f6e; border: 0.5px solid #b08d57; background: rgba(176, 141, 87, 0.14); }
  .rank-summary.rank-シルバー { color: #d7dade; border: 0.5px solid #9ea3ab; background: rgba(201, 205, 212, 0.12); }
  .rank-summary.rank-ゴールド { color: var(--accent2); border: 0.5px solid var(--accent2); background: var(--accent2-bg); box-shadow: 0 0 10px rgba(209, 163, 92, 0.35); }
  .diagnosis-card {
    background: var(--surface); border: 1px solid var(--accent2); border-radius: 14px;
    padding: 20px; text-align: center;
  }
  .diagnosis-label { font-size: 11px; color: var(--accent2); letter-spacing: 0.1em; margin-bottom: 10px; }
  .diagnosis-text { font-size: 15px; line-height: 1.8; margin-bottom: 16px; }
  .share-btn { width: 100%; padding: 12px 0; font-size: 13px; color: var(--accent2); border-color: var(--accent2); }
  .section-label { font-size: 11px; color: var(--text-muted); letter-spacing: 0.05em; margin-bottom: 2px; }
  .empty { text-align: center; color: var(--text-muted); font-size: 13px; padding: 30px 0; }
  .log-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 0.5px solid var(--border);
    width: 100%; text-align: left; background: none; border-left: none; border-right: none; border-top: none;
    border-radius: 0;
  }
  .log-row:last-child { border-bottom: none; }
  .log-row:hover { background: var(--surface-2); }
  .log-name { font-size: 14px; }
  .log-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .pref-pill { font-size: 11px; padding: 3px 9px; border-radius: 8px; background: var(--surface-2); color: var(--text-secondary); }
  .pref-pill.good { color: var(--accent2); background: var(--accent2-bg); }
  .primary-btn { width: 100%; padding: 17px; font-weight: 600; font-size: 15px; background: var(--accent); color: var(--bg); border: none; }
  .ghost-btn { width: 100%; padding: 10px; font-size: 12px; color: var(--text-muted); background: none; border: none; }
  .pref-row { display: flex; gap: 8px; }
  .pref-btn { flex: 1; padding: 12px 0; font-size: 13px; }
  .pref-btn.selected { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
  .err { color: #c96; font-size: 12px; }
</style>

      return Object.keys(bases).length >= Object.keys(BASE_LABEL).length - 1; // "その他"を除く
    }},
    { id: "explorer", label: "探検家(15種)", desc: "15種類以上の異なるお酒を記録する", rank: "gold", check: function (s) {
      var ids = {};
      s.forEach(function (log) { ids[log.drinkId] = true; });
      return Object.keys(ids).length >= 15;
    }},
    { id: "complete", label: "コンプリート", desc: "登録されている全" + DRINKS.length + "種類を記録する", rank: "gold", check: function (s) {
      var ids = {};
      s.forEach(function (log) { ids[log.drinkId] = true; });
      return Object.keys(ids).length >= DRINKS.length;
    }},
    { id: "sweet_tooth", label: "甘党", desc: "甘口寄りのお酒を5杯記録する", rank: "bronze", check: function (s) {
      return countMatchingDrinks(s, function (d) { return d.tags.sweetness > 0; }) >= 5;
    }},
    { id: "dry_lover", label: "辛口党", desc: "辛口寄りのお酒を5杯記録する", rank: "bronze", check: function (s) {
      return countMatchingDrinks(s, function (d) { return d.tags.sweetness < 0; }) >= 5;
    }},
    { id: "favorite_found", label: "推し発見", desc: "「好み」評価を3杯記録する", rank: "bronze", check: function (s) {
      return s.filter(function (log) { return log.preference === 3; }).length >= 3;
    }},
    { id: "repeater", label: "リピーター", desc: "同じお酒を3回記録する", rank: "silver", check: function (s) {
      var counts = {};
      s.forEach(function (log) { counts[log.drinkId] = (counts[log.drinkId] || 0) + 1; });
      for (var key in counts) { if (counts[key] >= 3) return true; }
      return false;
    }},
    { id: "glass_master", label: "グラス制覇", desc: "ロック/ハイボール/クープ/マグをすべて記録する", rank: "silver", check: function (s) {
      var glasses = {};
      s.forEach(function (log) {
        var d = DRINKS.find(function (x) { return x.id === log.drinkId; });
        if (d) glasses[d.glass] = true;
      });
      var allGlasses = {};
      DRINKS.forEach(function (d) { allGlasses[d.glass] = true; });
      return Object.keys(glasses).length >= Object.keys(allGlasses).length;
    }},
    { id: "carbonated_fan", label: "炭酸党", desc: "炭酸入りのお酒を5杯記録する", rank: "bronze", check: function (s) {
      return countMatchingDrinks(s, function (d) { return d.carbonated; }) >= 5;
    }}
  ];
  function countMatchingDrinks(s, predicate) {
    var count = 0;
    s.forEach(function (log) {
      var d = DRINKS.find(function (x) { return x.id === log.drinkId; });
      if (d && predicate(d)) count++;
    });
    return count;
  }
  function earnedBadgeIds(s) {
    var earned = {};
    BADGES.forEach(function (b) { if (b.check(s)) earned[b.id] = true; });
    return earned;
  }

  // ログイン中かつストックに無いお酒かどうか(未挑戦バッジの表示判定に使用)
  function isUntried(drinkId) {
    if (!currentUser) return false;
    return !stock.some(function (log) { return log.drinkId === drinkId; });
  }

  var RANK_LABEL = { bronze: "ブロンズ", silver: "シルバー", gold: "ゴールド" };
  // 獲得数から総合ランクを判定(全14個中)
  function overallRank(earnedCount) {
    if (earnedCount >= 12) return "ゴールド";
    if (earnedCount >= 9) return "シルバー";
    if (earnedCount >= 5) return "ブロンズ";
    return "見習い";
  }

  /* ============================================================
     3. SCORING
     ============================================================ */
  var NUMERIC_TAG_KEYS = ["mood", "sweetness", "intensity"];

  // Count each distinct drink once so repeats do not dominate a preference.
  function tasteProfile() {
    var entries = {};
    if (currentUser && !loadError) stock.forEach(function (log) {
      if (log.preference >= 1 && log.preference <= 3) entries[log.drinkId] = log.preference;
    });
    var rated = Object.keys(entries).map(function (id) {
      return { drink: DRINKS.find(function (d) { return d.id === id; }), preference: entries[id] };
    }).filter(function (item) { return !!item.drink; });
    var liked = rated.filter(function (item) { return item.preference === 3; });
    return { rated: rated, liked: liked, ready: rated.length >= 3 && liked.length >= 2 };
  }

  function drinkSimilarity(a, b) {
    if (a.genre !== b.genre) return 0;
    var distance = Math.abs((a.tags.sweetness || 0) - (b.tags.sweetness || 0)) +
      Math.abs((a.tags.intensity || 0) - (b.tags.intensity || 0)) +
      0.4 * Math.abs((a.tags.mood || 0) - (b.tags.mood || 0));
    var category = GENRES[a.genre].categoryKey;
    return Math.max(0, 1 - distance / 7) * 0.78 + (category && a[category] === b[category] ? 0.22 : 0);
  }

  /* ------------------------------------------------------------
     好み・低評価の共通ロジック。
     今日の一杯・診断結果・MAPの次候補は、すべてここを通して判定する。
     - 低評価は1件目から効く(好みの成立を待たない)。
     - 低評価に強く似た一杯は、候補が足りる限り外す。ベース全体は禁止しない。
     - 好みと低評価がぶつかる場合は、低評価に近い方を優先して下げる。
       ただし好みの一杯のほうが明らかに近い場合は、下げ幅を半分にする。
     ------------------------------------------------------------ */
  var DISLIKE_W = 7;   // 低評価に似ている候補を下げる強さ(回答一致の点数と同じ桁)
  var AVOID_AT = 0.6;  // この値以上は、候補から外す対象

  function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }

  // 好みに近い度合い(0〜1)。好みが成立する(3種類評価・うち2種類が好み)まで0。
  function likeAffinity(d, profile) {
    if (!profile.ready) return 0;
    var likes = profile.liked.filter(function (item) { return item.drink.genre === d.genre; });
    if (!likes.length) return 0;
    return Math.max.apply(null, likes.map(function (item) { return drinkSimilarity(d, item.drink); }));
  }

  // 低評価に似ている度合い(0〜1)。低評価が1件でもあれば初回から効く。
  function dislikePenalty(d, profile) {
    var own = profile.rated.find(function (item) { return item.drink.id === d.id; });
    if (own && own.preference === 3) return 0; // その一杯自身を好みと評価済みなら下げない
    var dislikes = profile.rated.filter(function (item) { return item.preference === 1 && item.drink.genre === d.genre; });
    if (!dislikes.length) return 0;
    var near = Math.max.apply(null, dislikes.map(function (item) { return drinkSimilarity(d, item.drink); }));
    var penalty = clamp01((near - 0.5) / 0.35);
    if (penalty > 0) {
      var likes = profile.liked.filter(function (item) { return item.drink.genre === d.genre && item.drink.id !== d.id; });
      if (likes.length) {
        var likedNear = Math.max.apply(null, likes.map(function (item) { return drinkSimilarity(d, item.drink); }));
        if (likedNear - near >= 0.15) penalty *= 0.5;
      }
    }
    return penalty;
  }

  // 理由表示や並べ替えに使う総合値(-1〜1)
  function personalScore(d, profile) {
    return likeAffinity(d, profile) - dislikePenalty(d, profile);
  }
  // 診断の点数に足す補正値。低評価の影響は、回答一致の点数と同じ桁で効かせる。
  function recAdjust(d, profile) {
    return likeAffinity(d, profile) * 1.25 - dislikePenalty(d, profile) * DISLIKE_W;
  }
  function isAvoided(d, profile) {
    return dislikePenalty(d, profile) >= AVOID_AT;
  }

  function personalReason(d, profile) {
    if (!profile.ready || dislikePenalty(d, profile) >= 0.3 || likeAffinity(d, profile) < 0.35) return "";
    var likes = profile.liked.filter(function (item) { return item.drink.genre === d.genre && item.drink.id !== d.id; });
    likes.sort(function (a, b) { return drinkSimilarity(d, b.drink) - drinkSimilarity(d, a.drink); });
    return likes.length && drinkSimilarity(d, likes[0].drink) >= 0.6
      ? "好みだった「" + likes[0].drink.name + "」に近い一杯" : "";
  }

  // 診断の回答と実際に一致した点だけを、短く示す(一致が無ければ空)。
  function answerReason(d, answers) {
    var parts = [];
    if (answers.base && d.base === answers.base) parts.push(BASE_LABEL[answers.base] + "ベース");
    var words = {
      sweetness: ["辛口寄り", "甘め"],
      intensity: ["軽め", "しっかり"],
      mood: ["静かな夜", "賑やかな夜"]
    };
    ["sweetness", "intensity", "mood"].forEach(function (key) {
      var a = answers[key], t = d.tags[key] || 0;
      if (typeof a === "number" && a !== 0 && a * t > 0) parts.push(words[key][a < 0 ? 0 : 1]);
    });
    return parts.length ? "回答と一致：" + parts.slice(0, 3).join("、") : "";
  }

  // 同じ日・同じ記録状態なら同じ結果になるよう、乱数の代わりに使う固定のゆらぎ(0〜1)
  function hash01(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return ((h >>> 0) % 10000) / 10000;
  }
  function localDayKey() {
    var t = new Date();
    return t.getFullYear() + "-" + (t.getMonth() + 1) + "-" + t.getDate();
  }
  function stockSignature() {
    return stock.map(function (log) { return log.drinkId + ":" + log.preference; }).join(",");
  }
  function userKey() { return currentUser ? currentUser.id : "guest"; }

  function tasteSummary(profile) {
    function axis(key, low, high) {
      var avg = profile.liked.reduce(function (sum, item) { return sum + (item.drink.tags[key] || 0); }, 0) / profile.liked.length;
      return avg <= -0.5 ? low : avg >= 0.5 ? high : "";
    }
    var traits = [axis("sweetness", "辛口寄り", "甘め寄り"), axis("intensity", "軽やか", "コクのある")].filter(Boolean);
    var bases = {};
    profile.liked.forEach(function (item) {
      if (item.drink.genre === "cocktail" && BASE_LABEL[item.drink.base]) bases[item.drink.base] = (bases[item.drink.base] || 0) + 1;
    });
    var favoriteBase = Object.keys(bases).sort(function (a, b) { return bases[b] - bases[a]; })[0];
    if (favoriteBase && bases[favoriteBase] >= 2) traits.unshift(BASE_LABEL[favoriteBase] + "ベースが好き");
    return traits.length ? traits.join("・") : "幅広い味わいを好む";
  }

  function computeResults(genre, answers) {
    var pool = DRINKS.filter(function (d) { return d.genre === genre; });
    var catKey = GENRES[genre].categoryKey; // カクテル:base / ビール:style
    var profile = tasteProfile();
    // 低評価に強く似た一杯は、候補が足りる限り外す(ベース全体は外さない)
    var usable = pool.filter(function (d) { return !isAvoided(d, profile); });
    if (usable.length >= 6) pool = usable;
    var seed = localDayKey() + "|" + stockSignature() + "|" + JSON.stringify(answers);
    var tried = {};
    if (currentUser && !loadError) stock.forEach(function (log) { tried[log.drinkId] = true; });
    var scored = pool.map(function (d) {
      var score = 0;
      NUMERIC_TAG_KEYS.forEach(function (key) {
        if (typeof answers[key] === "number") score += answers[key] * (d.tags[key] || 0);
      });
      if (catKey && answers[catKey] && d[catKey] === answers[catKey]) score += 3; // カテゴリ一致ボーナス
      score += recAdjust(d, profile); // 今の回答を優先し、好みと低評価は近い候補の順位に反映
      return { drink: d, score: score, rand: hash01(seed + "|" + d.id) };
    });
    scored.sort(function (a, b) {
      if (b.score !== a.score) return b.score - a.score;
      return a.rand - b.rand; // 同点は、日付・記録・回答から決まる固定のゆらぎで並べる(開き直しても変わらない)
    });
    var chosen = scored.slice(0, 3);
    var kinds = ["近い一杯", "近い一杯", "近い一杯"];
    var remaining = scored.filter(function (item) { return !chosen.some(function (x) { return x.drink.id === item.drink.id; }); });
    var best = scored.length ? scored[0].score : 0;
    var closeEnough = remaining.filter(function (item) { return item.score >= best - 4; });
    var adjacent = closeEnough.find(function (item) {
      return !chosen.some(function (x) { return x.drink[catKey] === item.drink[catKey]; });
    }) || closeEnough[0] || remaining[0];
    if (adjacent) {
      chosen.push(adjacent); kinds.push(adjacent.score >= best - 4 ? "少し意外" : "おすすめ");
      remaining = remaining.filter(function (item) { return item.drink.id !== adjacent.drink.id; });
    }
    var explorePool = remaining.filter(function (item) { return item.score >= best - 5 && !tried[item.drink.id]; });
    // Respect an explicitly chosen base; exploration happens within it if possible.
    if (catKey && answers[catKey]) {
      var sameBase = explorePool.filter(function (item) { return item.drink[catKey] === answers[catKey]; });
      if (sameBase.length) explorePool = sameBase;
    }
    var unexplored = explorePool.find(function (item) {
      return !chosen.some(function (x) { return x.drink[catKey] === item.drink[catKey]; });
    }) || explorePool[0] || remaining[0];
    if (unexplored) {
      chosen.push(unexplored); kinds.push(explorePool.indexOf(unexplored) !== -1 ? (stock.length ? "未開拓" : "新しい一杯") : "おすすめ");
    }
    var results = chosen.map(function (item) { return item.drink; });
    results.kinds = kinds;
    return results;
  }

  // 同じジャンルの中から、カテゴリ軸(base/style)が同じものを優先し、足りない分は味が近い順に補う
  function relatedDrinks(d, limit) {
    limit = limit || 3;
    var sameGenre = DRINKS.filter(function (x) { return x.id !== d.id && x.genre === d.genre; });
    var catKey = GENRES[d.genre] && GENRES[d.genre].categoryKey;

    if (catKey) {
      var sameCat = sameGenre.filter(function (x) { return x[catKey] === d[catKey]; });
      sameCat.sort(function (a, b) { return tagDistance(a, d) - tagDistance(b, d); });
      if (sameCat.length >= limit) return sameCat.slice(0, limit);
      var others = sameGenre.filter(function (x) { return x[catKey] !== d[catKey]; });
      others.sort(function (a, b) { return tagDistance(a, d) - tagDistance(b, d); });
      return sameCat.concat(others).slice(0, limit);
    }

    sameGenre.sort(function (a, b) { return tagDistance(a, d) - tagDistance(b, d); });
    return sameGenre.slice(0, limit);
  }
  function tagDistance(a, b) {
    var sum = 0;
    NUMERIC_TAG_KEYS.forEach(function (key) {
      var diff = (a.tags[key] || 0) - (b.tags[key] || 0);
      sum += diff * diff;
    });
    return sum;
  }

  /* ============================================================
     4. APP STATE / ROUTER
     「戻る」がどの画面から来たかに関わらず正しく機能するよう、
     navigate()で画面遷移するたびに直前の状態をhistoryへ積み、
     goBack()でそれをポップして復元するシンプルな履歴スタック。
     ============================================================ */
  function emptyFilters() {
    return { intensity: [], sweetness: [], mood: [], base: [], carbonated: [] };
  }
  var state = { screen: "start", genre: "cocktail", registryGenre: "cocktail", answers: {}, qIndex: 0, results: [], detailId: null, pendingPref: null, searchText: "", filters: emptyFilters(), authMode: "login" };
  var history = [];

  function navigate(screen, patch) {
    history.push(Object.assign({}, state));
    state = Object.assign({}, state, { screen: screen }, patch || {});
    render();
  }

  function goBack() {
    state = history.length
      ? history.pop()
      : { screen: "start", genre: "cocktail", registryGenre: "cocktail", answers: {}, qIndex: 0, results: [], detailId: null, pendingPref: null, searchText: "", filters: emptyFilters(), authMode: "login" };
    render();
  }

  /* ============================================================
     5. RENDER HELPERS
     ============================================================ */
  function el(html) {
    var t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstChild;
  }

  // 戻ると本当に失われる入力がある画面かどうか(質問の途中/好み選択の途中)
  function hasUnsavedInput() {
    return state.screen === "question" || (state.screen === "detail" && state.pendingPref) || ((state.screen === "auth" || state.screen === "newPassword") && authInputFilled());
  }

  function confirmGoHome() {
    if (state.screen === "start") return; // すでにトップなら何もしない
    if (!hasUnsavedInput()) { history = []; state.screen = 'start'; render(); return; }
    var message = hasUnsavedInput() ? "トップに戻りますか?<br>入力中の内容は失われます" : "トップに戻りますか?";
    var overlay = el(
      '<div class="modal-overlay"><div class="modal-card">' +
      '<div class="modal-text">' + message + "</div>" +
      '<div class="modal-actions">' +
      '<button class="modal-cancel">キャンセル</button>' +
      '<button class="modal-confirm">トップに戻る</button>' +
      "</div></div></div>"
    );
    document.body.appendChild(overlay);
    overlay.addEventListener("click", function (e) { if (e.target === overlay) overlay.remove(); });
    overlay.querySelector(".modal-cancel").addEventListener("click", function () { overlay.remove(); });
    overlay.querySelector(".modal-confirm").addEventListener("click", function () {
      overlay.remove();
      history = [];
      state = { screen: "start", genre: "cocktail", registryGenre: "cocktail", answers: {}, qIndex: 0, results: [], detailId: null, pendingPref: null, searchText: "", filters: emptyFilters(), authMode: "login" };
      render();
    });
  }

  function renderNewPassword(root) {
    root.appendChild(topbar(false));
    root.appendChild(el('<h2 style="text-align:center;">新しいパスワードを設定</h2>'));

    var pwInput = el('<input class="search-input" type="password" placeholder="新しいパスワード(6文字以上)" autocomplete="new-password" />');
    root.appendChild(pwInput);

    var errBox = el('<div class="err" style="text-align:center;min-height:14px;margin-top:8px;"></div>');
    root.appendChild(errBox);

    var submitBtn = el('<button class="primary-btn" style="margin-top:4px;">設定する</button>');
    submitBtn.addEventListener("click", async function () {
      var password = pwInput.value;
      if (!password || password.length < 6) {
        errBox.textContent = "6文字以上のパスワードを入力してください";
        return;
      }
      submitBtn.disabled = true;
      submitBtn.textContent = "設定中...";
      var result = await supabaseClient.auth.updateUser({ password: password });
      submitBtn.disabled = false;
      submitBtn.textContent = "設定する";
      if (result.error) {
        errBox.textContent = result.error.message;
        return;
      }
      currentUser = result.data.user;
      await loadStockFromServer();
      isPasswordRecovery = false;
      history = [];
      state.screen = "start";
      render();
    });
    root.appendChild(submitBtn);
    root.appendChild(authHomeBtn());
  }

  function renderAuth(root) {
    root.appendChild(topbar(true));

    if (authLinkError) {
      var linkErrorBox = el('<div class="err" style="text-align:center;margin:10px 0;"></div>');
      linkErrorBox.textContent = authLinkError;
      root.appendChild(linkErrorBox);
    }

    if (state.authMode === "reset") {
      root.appendChild(el('<h2 style="text-align:center;">パスワード再設定</h2>'));
      root.appendChild(el('<div class="result-tagline">登録したメールアドレスに再設定用のリンクを送ります</div>'));

      var resetEmailInput = el('<input class="search-input" type="email" placeholder="メールアドレス" autocomplete="email" />');
      root.appendChild(resetEmailInput);

      var resetErrBox = el('<div class="err" style="text-align:center;min-height:14px;margin-top:8px;"></div>');
      root.appendChild(resetErrBox);

      var resetBtn = el('<button class="primary-btn" style="margin-top:4px;">送信する</button>');
      resetBtn.addEventListener("click", async function () {
        var email = resetEmailInput.value.trim();
        if (!email) {
          resetErrBox.textContent = "メールアドレスを入力してください";
          return;
        }
        var redirectUrl = authRedirectUrl();
        if (!redirectUrl) {
          resetErrBox.textContent = "メール認証には、公開済みのHTTPSサイトでこのページを開いてください";
          return;
        }
        resetBtn.disabled = true;
        resetBtn.textContent = "送信中...";
        var result = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo: redirectUrl });
        resetBtn.disabled = false;
        resetBtn.textContent = "送信する";
        if (result.error) {
          resetErrBox.textContent = result.error.message;
          return;
        }
        resetErrBox.style.color = "var(--text-secondary)";
        resetErrBox.textContent = "再設定用のメールを送信しました。メール内のリンクを開いてください";
      });
      root.appendChild(resetBtn);

      var backToLogin = el('<button class="ghost-btn">ログイン画面に戻る</button>');
      backToLogin.addEventListener("click", function () { state.authMode = "login"; render(); });
      root.appendChild(backToLogin);
      root.appendChild(authHomeBtn());
      return;
    }

    root.appendChild(el(
      '<h2 style="text-align:center;">' + (state.authMode === "signup" ? "新規登録" : "ログイン") + "</h2>"
    ));

    var signingUp = state.authMode === "signup";
    var form = el('<form novalidate></form>');
    var emailInput = el('<input class="search-input" type="email" inputmode="email" autocapitalize="none" spellcheck="false" placeholder="メールアドレス" autocomplete="email" required aria-label="メールアドレス" />');
    var pwInput = el('<input class="search-input" type="password" placeholder="パスワード(6文字以上)" autocomplete="' + (signingUp ? "new-password" : "current-password") + '" minlength="6" required aria-label="パスワード" style="margin-top:10px;" />');
    form.appendChild(emailInput);
    emailInput.value = authDraftEmail;
    emailInput.addEventListener("input", function () { authDraftEmail = emailInput.value; });
    form.appendChild(pwInput);

    var errBox = el('<div class="err" style="text-align:center;min-height:14px;margin-top:8px;"></div>');
    errBox.setAttribute("role", "status");
    errBox.setAttribute("aria-live", "polite");
    form.appendChild(errBox);

    var submitBtn = el(
      '<button type="submit" class="primary-btn" style="margin-top:4px;">' + (signingUp ? "登録する" : "ログイン") + "</button>"
    );

      event.preventDefault();
      if (submitBtn.disabled) return;
      var email = emailInput.value.trim();
      var password = pwInput.value;
      errBox.style.color = "";
      if (!email || !password) {
        errBox.textContent = "メールアドレスとパスワードを入力してください";
        return;
      }
      if (!emailInput.checkValidity()) { errBox.textContent = "メールアドレスの形式を確認してください"; emailInput.focus(); return; }
      if (signingUp && password.length < 6) { errBox.textContent = "パスワードは6文字以上で入力してください"; pwInput.focus(); return; }
      var redirectUrl = authRedirectUrl();
      if (signingUp && !redirectUrl) {
        errBox.textContent = "メール認証には、公開済みのHTTPSサイトでこのページを開いてください";
        return;
      }
      submitBtn.disabled = true;
      submitBtn.textContent = "処理中...";

      try {
        var result = signingUp
          ? await supabaseClient.auth.signUp({ email: email, password: password, options: { emailRedirectTo: redirectUrl } })
          : await supabaseClient.auth.signInWithPassword({ email: email, password: password });
        if (result.error) { errBox.textContent = authMessage(result.error); return; }
        if (signingUp && !result.data.session) {
          errBox.style.color = "var(--text-secondary)";
          errBox.textContent = "確認メールを送信しました。受信箱と迷惑メールを確認し、リンクを開いてください。すでに登録済みの場合はログインをお試しください。";
          resendBtn.hidden = false;
          return;
        }
        currentUser = result.data.user;
        await loadStockFromServer();
        authDraftEmail = "";
        // 記録しようとしていた画面から来た場合は、その画面へ戻す
        if (history.length && history[history.length - 1].screen !== "auth") goBack(); else navigate("start");
      } catch (error) {
        errBox.textContent = authMessage(error);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = signingUp ? "登録する" : "ログイン";
      }
    });
    form.appendChild(submitBtn);
    root.appendChild(form);

  /* ============================================================
     今日の一杯(三択)
     1枠: 本命 / 2枠: 少し違う方向 / 3枠: 無理のない未開拓
     同じ日・同じ記録状態なら、開き直しても同じ3杯。記録が増えたら再計算する。
     「別の一杯を見る」は、その枠だけを差し替えるその場のパス。
     苦手などの恒久データは作らない(低評価は、飲んだ後の評価だけが記録される)。
     ============================================================ */
  var dailyIndex = 0;   // 三択のどのカードを見ていたか(ホームに戻ったとき用)
  var dailyMem = null;  // 三択の状態(sessionStorageにも保存)

  function drinkById(id) {
    return DRINKS.find(function (d) { return d.id === id; }) || null;
  }

  function dailyCtx() {
    var profile = tasteProfile(), tried = {};
    stock.forEach(function (log) { tried[log.drinkId] = true; });
    return {
      profile: profile,
      ready: profile.ready,
      tried: tried,
      hasRecords: stock.length > 0,
      seed: userKey() + "|" + localDayKey() + "|" + stockSignature()
    };
  }

  // 一般的な入りやすさ: 強すぎず、甘さが極端でないほど高い(0〜3程度)
  function approach(d) {
    var t = d.tags;
    return 3 - Math.max(0, t.intensity || 0) - 0.5 * Math.abs(t.sweetness || 0) - (d.base === "other" ? 0.3 : 0);
  }

  // 文章の理由で使う、味の特徴。中庸な軸は言わない。言葉はチップ(strengthLabel / sweetLabel)と同じ。
  function tasteParts(d) {
    var parts = [];
    if ((d.tags.sweetness || 0) !== 0) parts.push(sweetLabel(d));
    if ((d.tags.intensity || 0) !== 0) parts.push(strengthLabel(d));
    return parts;
  }
  function tasteLead(d) {
    var s = (d.tags.sweetness || 0) !== 0 ? sweetLabel(d) : "";
    var i = (d.tags.intensity || 0) !== 0 ? (strengthLabel(d) === "しっかり" ? "しっかりした味わい" : "軽め") : "";
    return s && i ? s + "で" + i : s || i || "クセの少ない味わい";
  }
  // 1枠目との違いを短い言葉で。違いが無ければ空。
  function diffWord(d, a) {
    var dS = (d.tags.sweetness || 0) - (a.tags.sweetness || 0), dI = (d.tags.intensity || 0) - (a.tags.intensity || 0);
    if (Math.abs(dS) >= Math.abs(dI) && dS !== 0) return dS < 0 ? "より辛口寄り" : "より甘め";
    if (dI !== 0) return dI < 0 ? "より軽め" : "より強め";
    return "";
  }

  function slotScore(i, d, picks, ctx) {
    var p = ctx.profile;
    var pen = dislikePenalty(d, p), aff = likeAffinity(d, p);
    var jitter = hash01(ctx.seed + "|" + i + "|" + d.id);
    var isTried = !!ctx.tried[d.id];
    var s;
    if (i === 0) {
      s = ctx.ready ? aff * 6 + approach(d) * 0.6 : approach(d) * 1.5;
      if (isTried && ctx.hasRecords) s -= 2;
      s += jitter * 0.8;
    } else if (i === 1) {
      var a = picks[0];
      var contrast = a
        ? Math.abs((d.tags.sweetness || 0) - (a.tags.sweetness || 0)) +
          Math.abs((d.tags.intensity || 0) - (a.tags.intensity || 0)) +
          0.4 * Math.abs((d.tags.mood || 0) - (a.tags.mood || 0))
        : 0;
      // 「少し違う」=違いが大きすぎない(目安3前後)ことを優先する
      s = 3 - Math.abs(contrast - 3) + approach(d) * 0.8 + (ctx.ready ? aff * 2 : 0) + (a && d.base !== a.base ? 1 : 0);
      if (isTried && ctx.hasRecords) s -= 2;
      s += jitter * 0.8;
    } else {
      var others = [picks[0], picks[1]].filter(Boolean);
      var newBase = others.every(function (x) { return x.base !== d.base; });
      s = approach(d) + (ctx.ready ? aff * 3 : 0) + (newBase ? 1.5 : 0);
      if (!isTried) s += 4;
      s += jitter * 0.8;
    }
    return s - pen * DISLIKE_W;
  }

  function bestForSlot(i, picks, excluded, ctx, relax) {
    var best = null, bestScore = -Infinity;
    DRINKS.forEach(function (d) {
      if (excluded[d.id]) return;
      if (!relax && isAvoided(d, ctx.profile)) return;
      var sc = slotScore(i, d, picks, ctx);
      if (sc > bestScore || (sc === bestScore && best && d.id < best.id)) { best = d; bestScore = sc; }
    });
    return best;
  }

  function buildDailyPicks() {
    var ctx = dailyCtx(), picks = [], ids = [], excluded = {};
    for (var i = 0; i < 3; i++) {
      var best = bestForSlot(i, picks, excluded, ctx, false) || bestForSlot(i, picks, excluded, ctx, true);
      picks.push(best); ids.push(best.id); excluded[best.id] = true;
    }
    return ids;
  }

  function dailyStoreKey() { return "barlog:daily:" + userKey(); }
  function saveDaily(s) {
    dailyMem = s;
    try { sessionStorage.setItem(dailyStoreKey(), JSON.stringify(s)); } catch (e) { /* private browsing */ }
  }
  function loadDaily() {
    var day = localDayKey(), sig = stockSignature(), user = userKey();
    var s = dailyMem;
    if (!s) {
      try { s = JSON.parse(sessionStorage.getItem(dailyStoreKey()) || "null"); } catch (e) { s = null; }
    }
    var valid = s && s.user === user && s.day === day && s.sig === sig && Array.isArray(s.slots) && s.slots.length === 3 &&
      s.slots.every(function (id) { return !!drinkById(id); });
    if (valid) { dailyMem = s; return s; }
    s = { user: user, day: day, sig: sig, slots: buildDailyPicks(), shown: [], exhausted: [false, false, false] };
    s.shown = s.slots.slice();
    dailyIndex = 0;
    saveDaily(s);
    return s;
  }

  // 1枠だけ差し替える。表示中の他の2杯と、今日すでに出した候補は繰り返さない。
  function swapDaily(i) {
    var s = loadDaily(), ctx = dailyCtx();
    var picks = s.slots.map(drinkById);
    var excluded = {};
    s.shown.forEach(function (id) { excluded[id] = true; });
    s.slots.forEach(function (id) { excluded[id] = true; });
    var cand = bestForSlot(i, picks, excluded, ctx, false);
    if (!cand) { s.exhausted[i] = true; saveDaily(s); return null; }
    s.slots[i] = cand.id;
    s.shown.push(cand.id);
    saveDaily(s);
    return cand;
  }

  // 3杯まとめて選び直す。新しい3杯を先に全部そろえ、そろったときだけ反映する。

  /* ---- 「この店になかった」: 代わりに頼めそうな一杯を根拠つきで出す ----

     除外の記憶はこの画面を開いている間だけ(ホームに戻ると解除)。保存しない。 */
  var missedHere = [];
  function citrusIn(d) { return /レモン|ライム|オレンジ|グレープフルーツ/.test(d.recipe); }
  function altCandidates(d, limit) {
    var profile = tasteProfile(), out = [];
    DRINKS.forEach(function (x) {
      if (x.id === d.id || missedHere.indexOf(x.id) !== -1 || isAvoided(x, profile)) return;
      var sameBase = x.base === d.base && d.base !== "other";
      var close = Math.abs((x.tags.sweetness || 0) - (d.tags.sweetness || 0)) <= 1 && Math.abs((x.tags.intensity || 0) - (d.tags.intensity || 0)) <= 1;
      var citrus = citrusIn(x) && citrusIn(d);
      if (!sameBase && !close && !citrus) return; // 根拠が無いものは出さない
      var reasons = [];
      if (sameBase) reasons.push(baseText(d) + "で同じ");
      if (close) reasons.push("甘さと強さが近い");
      if (citrus) reasons.push("どちらも柑橘を使うレシピ");
      if (x.carbonated && d.carbonated) reasons.push("どちらも炭酸あり");

      out.push({ drink: x, reasons: reasons.slice(0, 2), score: score });

  }

  /* ---- ブラウザの戻る操作と、内部の履歴(history)をそろえる ----
     画面を進めるたびにブラウザ履歴を1件足し、画面が戻ったらその分だけ戻す。
     iPhoneのスワイプバックでも、アプリの前の画面に戻る。 */
  var browserDepth = 0, suppressPop = false;
  function syncBrowserHistory() {
    try {
      var want = history.length;
      if (want > browserDepth) {
        for (var k = browserDepth + 1; k <= want; k++) window.history.pushState({ barlog: k }, "");
        browserDepth = want;
      } else if (want < browserDepth) {
        var back = browserDepth - want;
        browserDepth = want;
        suppressPop = true;
        window.history.go(-back);
        setTimeout(function () { suppressPop = false; }, 600);
      }
    } catch (e) { /* history API unavailable */ }
  }
  window.addEventListener("popstate", function (e) {
    if (suppressPop) { suppressPop = false; return; }
    var depth = (e.state && e.state.barlog) || 0;
    if (depth < browserDepth) {
      var pops = browserDepth - depth;
      browserDepth = depth; // 先に更新し、描画後の同期で二重に戻さない
      for (var i = 0; i < pops && history.length; i++) state = history.pop();
      render();
    }
  });

    ]}
  ];

    return FILTER_GROUPS.every(function (group) {

      var actual = group.key === "intensity" || group.key === "sweetness" || group.key === "mood"
        ? bucket(d.tags[group.key] || 0)
        : d[group.key];
      return selected.indexOf(actual) !== -1;
    });
  }

      listWrap.innerHTML = "";
      var q = state.searchText.trim();
      var filtered = DRINKS.filter(function (d) {
        return d.genre === state.registryGenre && (!q || d.name.indexOf(q) !== -1) && matchesFilters(d, state.filters);
      });

      if (!filtered.length) {
        listWrap.appendChild(el('<div class="card empty">該当するお酒がありません</div>'));
        return;
      }

      var list = el('<div class="drink-list"></div>');
      filtered.forEach(function (d) {
        list.appendChild(drinkListRow(d, 'search', currentUser ? (isUntried(d.id) ? 'まだ飲んでいない' : '飲んだ記録あり') : ''));
      });
      listWrap.appendChild(list);
    }

    input.addEventListener("input", function () {
      state.searchText = input.value;
      renderList();
    });

    renderList();
  }

  function renderStock(root) {
    root.appendChild(topbar(true));
    root.appendChild(el('<h2>飲んだ記録</h2>'));

    if (!stock.length) {
      if (currentUser) {
        root.appendChild(el('<div class="card empty">まだ記録がありません</div>'));
      } else {
        root.appendChild(el('<div class="card empty">ログインすると記録を保存できます</div>'));
        var loginBtn = el('<button class="primary-btn" style="margin-top:10px;">ログインする</button>');
        loginBtn.addEventListener("click", function () { navigate("auth"); });
        root.appendChild(loginBtn);
      }
      return;
    }

    var list = el('<div class="drink-list"></div>');
    var sorted = stock.slice().reverse();
    sorted.forEach(function (log) {
      var d = DRINKS.find(function (x) { return x.id === log.drinkId; });
      var date = new Date(log.timestamp);
      var dateStr = (date.getMonth() + 1) + '/' + date.getDate();
      if (d) list.appendChild(drinkListRow(d, 'log', dateStr + ' · ' + (PREF_LABEL[log.preference] || '記録済み')));
      else list.appendChild(el('<div class="card sub-note">記録したお酒を表示できません</div>'));
    });
    root.appendChild(list);
  }

  /* ============================================================
     7. MAIN RENDER
     ============================================================ */
  function render() {
    var app = document.getElementById("app");
    app.innerHTML = "";
    var root = el('<div class="screen"></div>');
    app.appendChild(root);
    if (!ageOk && PRE_GATE_SCREENS.indexOf(state.screen) === -1) { renderAgeGate(root); renderTabbar(); syncBrowserHistory(); return; }
    if (state.screen === "auth") renderAuth(root);
    else if (state.screen === "newPassword") renderNewPassword(root);
    else if (state.screen === "start") renderStart(root);
    else if (state.screen === "badges") renderBadges(root);
    else if (state.screen === "genreSelect") renderGenreSelect(root);
    else if (state.screen === "question") renderQuestion(root);
    else if (state.screen === "results") renderResults(root);
    else if (state.screen === "detail") renderDetail(root);
    else if (state.screen === "registry") renderRegistry(root);
    else if (state.screen === "stock") renderStock(root);
    else if (state.screen === "map") renderMap(root);
    else if (state.screen === "collections") renderCollections(root);
    else if (state.screen === "collectionDetail") renderCollectionDetail(root);
    else if (state.screen === "favorites") renderFavorites(root);
    else if (state.screen === "profile") renderProfile(root);
    else if (state.screen === "guide") renderGuideIndex(root);
    else if (state.screen === "guideDetail") renderGuideDetail(root);
    else if (state.screen === "howto") renderHowto(root);
    else if (state.screen === "terms") renderTerms(root);
    else if (state.screen === "privacy") renderPrivacy(root);
    else if (state.screen === "drinking") renderDrinking(root);
    else if (state.screen === "contact") renderContact(root);
    appendScreenAd(root);
    renderTabbar();
    syncBrowserHistory();
  }

  // 起動時にログイン済みかどうかを確認し、画面を出し分ける
  async function boot() {
    try { window.history.replaceState({ barlog: 0 }, ""); } catch (e) {}
    var urlParams = new URLSearchParams(window.location.search);
    var hashParams = new URLSearchParams(window.location.hash.slice(1));
    var linkError = urlParams.get("error") || hashParams.get("error");
    if (linkError) {
      authLinkError = linkError === "access_denied"
        ? "認証リンクが無効か、期限切れです。新しいメールを送信してください。"
        : "メールの認証に失敗しました。新しいメールを送信してください。";
      // URLのエラーを残すと、次に開いた時も同じメッセージが表示される。
      urlParams.delete("error");
      urlParams.delete("error_code");
      urlParams.delete("error_description");
      hashParams.delete("error");
      hashParams.delete("error_code");
      hashParams.delete("error_description");
      var cleanUrl = window.location.pathname + (urlParams.toString() ? "?" + urlParams : "") + (hashParams.toString() ? "#" + hashParams : "");
      window.history.replaceState(null, "", cleanUrl);
    }
    try {
      var sessionRes = await supabaseClient.auth.getSession();
      if (sessionRes.data && sessionRes.data.session) {
        currentUser = sessionRes.data.session.user;
        await loadStockFromServer();
      } else {
        currentUser = null;
      }
    } catch (e) {
      currentUser = null;
    }
    if (!isPasswordRecovery) state.screen = authLinkError ? "auth" : "start";
    render();
  }

  // ログアウトしたら、ストックをクリアしてスタート画面に戻す(ログイン画面は強制しない)
  supabaseClient.auth.onAuthStateChange(function (event, session) {
    if (event === "SIGNED_OUT") {
      currentUser = null;
      stock = [];
      history = [];
      state = { screen: "start", genre: "cocktail", registryGenre: "cocktail", answers: {}, qIndex: 0, results: [], detailId: null, pendingPref: null, searchText: "", filters: emptyFilters(), authMode: "login" };
      render();
    } else if (event === "SIGNED_IN" && session) {
      currentUser = session.user;
    } else if (event === "PASSWORD_RECOVERY") {
      isPasswordRecovery = true;
      history = [];
      state.screen = "newPassword";
      render();
    }
  });

  boot();
})();
</script>
