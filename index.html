<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="twitter:title" content="BAR LOG">

<style>
  /* ============================================================
     THEME TOKENS — 黒×白のモノトーン。ダークがデフォルト、
     OS側がライト指定の場合のみ反転する。
     ============================================================ */
  :root {
    --bg: #000000;
    --surface: #000000;
    --surface-2: #141414;
    --border: #333333;
    --text-primary: #ffffff;
    --text-secondary: #999999;
    --text-muted: #666666;
    --accent: #ffffff;
    --accent-bg: #1a1a1a;
    --accent2: #d1a35c;
    --accent2-bg: rgba(209, 163, 92, 0.14);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #ffffff;
      --surface: #ffffff;
      --surface-2: #f2f2f2;
      --border: #cccccc;
      --text-primary: #000000;
      --text-secondary: #555555;
      --text-muted: #888888;
      --accent: #000000;
      --accent-bg: #ededed;
      --accent2: #a3742a;
      --accent2-bg: rgba(163, 116, 42, 0.1);
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000;
    --surface: #000000;
    --surface-2: #141414;
    --border: #333333;
    --text-primary: #ffffff;
    --text-secondary: #999999;
    --text-muted: #666666;
    --accent: #ffffff;
    --accent-bg: #1a1a1a;
    --accent2: #d1a35c;
    --accent2-bg: rgba(209, 163, 92, 0.14);
  }

  /* ============================================================
     BASE / LAYOUT
     ============================================================ */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: "SF Mono", "JetBrains Mono", "Menlo", "Consolas",
      "Hiragino Sans", "Yu Gothic Medium", "Yu Gothic", sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  #app {
    width: 100%;
    max-width: 420px;
    min-height: 100vh;
    padding: 24px 20px 60px;
    overflow-x: auto;
  }
  @media (min-width: 640px) {
    body {
      align-items: center;
      padding: 48px 20px;
      background:
        radial-gradient(circle at 15% 20%, rgba(209, 163, 92, 0.08), transparent 42%),
        radial-gradient(circle at 85% 75%, rgba(209, 163, 92, 0.05), transparent 45%),
        var(--bg);
    }
    #app {
      min-height: auto;
      max-height: 880px;
      overflow-y: auto;
      border: 0.5px solid var(--border);
      border-radius: 26px;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.55);
    }
  }
  h1, h2, h3 { font-weight: 500; margin: 0; }
  p { margin: 0; line-height: 1.6; }
  button {
    font-family: inherit;
    cursor: pointer;
    border: 0.5px solid var(--border);
    background: var(--surface);
    color: var(--text-primary);
    border-radius: 10px;
    transition: background 0.15s, transform 0.1s;
  }
  button:active { transform: scale(0.98); }
  button:disabled {
    opacity: 0.4; cursor: not-allowed; pointer-events: none;
  }
  button:disabled:active { transform: none; }
  .screen { display: flex; flex-direction: column; gap: 20px; animation: screenIn 0.2s ease; }
  @keyframes screenIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .topbar { display: flex; align-items: center; gap: 12px; }
  .back-btn {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; padding: 0; flex-shrink: 0;
  }
  .logo {
    font-size: 11px; letter-spacing: 0.1em; color: var(--text-secondary);
    background: var(--surface); border: 0.5px solid var(--border); border-radius: 20px;
    padding: 6px 14px 6px 10px; cursor: pointer; font-family: inherit;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .logo:active { background: var(--surface-2); color: var(--text-primary); }
  .home-icon { flex-shrink: 0; }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6);
    display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 24px;
  }
  .modal-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 14px; padding: 20px; max-width: 320px; width: 100%; }
  .modal-text { font-size: 13px; color: var(--text-primary); line-height: 1.6; margin-bottom: 16px; text-align: center; }
  .modal-actions { display: flex; gap: 10px; }
  .modal-cancel { flex: 1; padding: 12px 0; font-size: 13px; }
  .modal-confirm { flex: 1; padding: 12px 0; font-size: 13px; background: var(--accent); color: var(--bg); border: none; }

  /* ============================================================
     SHARED COMPONENTS
     ============================================================ */
  .card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 14px;
    padding: 18px;
  }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-card { background: var(--surface-2); border-radius: 12px; padding: 14px; }
  .stat-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .stat-value { font-size: 20px; font-weight: 500; }
  .nav-list { display: flex; flex-direction: column; gap: 10px; }
  .nav-item { display: flex; align-items: center; gap: 14px; padding: 16px 14px; text-align: left; width: 100%; }
  .nav-item:disabled { opacity: 0.4; cursor: default; }
  .row-arrow { color: var(--text-muted); font-size: 16px; margin-left: auto; flex-shrink: 0; }
  .nav-title { font-size: 14px; font-weight: 500; }
  .nav-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .progress { display: flex; gap: 4px; }
  .dot { height: 4px; border-radius: 2px; flex: 1; background: var(--border); }
  .dot.active { background: var(--accent2); }
  .q-title { font-size: 17px; font-weight: 500; text-align: center; margin: 8px 0 4px; }
  .q-count { font-size: 12px; color: var(--text-muted); text-align: center; }
  .option-btn { padding: 14px 16px; text-align: left; font-size: 14px; display: flex; align-items: center; gap: 10px; }
  .option-btn:hover { background: var(--surface-2); }
  .result-tagline { font-size: 12px; color: var(--text-secondary); text-align: center; margin-top: -8px; }
  .drink-card { padding: 14px; border-radius: 12px; }
  .drink-card.best { border: 1.5px solid var(--accent2); }
  .badge {
    display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 6px;
    background: var(--accent2-bg); color: var(--accent2); margin-bottom: 6px;
  }
  .drink-name { font-size: 15px; font-weight: 500; margin-bottom: 3px; }
  .drink-line { font-size: 12px; color: var(--text-secondary); }
  .info-box {
    background: var(--surface-2); border-radius: 12px; padding: 14px;
    font-size: 12px; color: var(--text-secondary); line-height: 1.7;
  }
  .info-label { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; letter-spacing: 0.05em; }
  .trait-row + .trait-row { margin-top: 14px; }
  .trait-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; }
  .trait-track { position: relative; height: 3px; background: var(--border); border-radius: 2px; }
  .trait-dot { position: absolute; top: 50%; width: 11px; height: 11px; border-radius: 50%; background: var(--accent); transform: translate(-50%, -50%); }
  .trait-divider { border-top: 0.5px solid var(--border); margin: 14px 0; }
  .trivia-quote {
    border-left: 2px solid var(--border); padding-left: 12px;
    font-size: 12px; color: var(--text-secondary); line-height: 1.7;
  }
  .more-toggle {
    background: none; border: none; padding: 4px 0 0 12px; font-size: 12px;
    color: var(--accent2); text-align: left;
  }
  .trivia-section { font-size: 12px; color: var(--text-secondary); line-height: 1.7; }
  .trivia-section + .trivia-section { margin-top: 12px; }
  .trivia-section-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; letter-spacing: 0.05em; }
  .swatch { flex-shrink: 0; border: 0.5px solid var(--border); }
  /* グラスの形(サイズ非依存の形状) */
  .glass-rock { border-radius: 2px 2px 6px 6px; }
  .glass-highball { border-radius: 2px 2px 4px 4px; }
  .glass-coupe { clip-path: polygon(0% 0%, 100% 0%, 58% 62%, 58% 100%, 42% 100%, 42% 62%); }
  .glass-mug { border-radius: 3px 3px 8px 8px; position: relative; }
  .glass-cup { border-radius: 50% 50% 45% 45%; }
  .swatch-lg.glass-mug::after {
    content: ""; position: absolute; right: -8px; top: 6px; width: 8px; height: 12px;
    border: 2px solid var(--border); border-left: none; border-radius: 0 8px 8px 0;
  }
  /* 詳細画面用の大きいサイズ */
  .swatch-lg.glass-rock { width: 30px; height: 28px; }
  .swatch-lg.glass-highball { width: 18px; height: 44px; }
  .swatch-lg.glass-coupe { width: 40px; height: 34px; }
  .swatch-lg.glass-mug { width: 26px; height: 30px; }
  .swatch-lg.glass-cup { width: 32px; height: 22px; }
  /* 凡例用の中間サイズ */
  .swatch-md.glass-rock { width: 20px; height: 24px; }
  .swatch-md.glass-highball { width: 13px; height: 30px; }
  .swatch-md.glass-coupe { width: 24px; height: 26px; }
  .swatch-md.glass-mug { width: 18px; height: 22px; }
  /* 一覧行用の小さいサイズ */
  .swatch-sm.glass-rock { width: 14px; height: 18px; border-radius: 1px 1px 4px 4px; }
  .swatch-sm.glass-highball { width: 9px; height: 22px; }
  .swatch-sm.glass-coupe { width: 16px; height: 20px; }
  .swatch-sm.glass-mug { width: 13px; height: 18px; border-radius: 1px 1px 4px 4px; }
  .swatch-sm.glass-cup { width: 16px; height: 12px; }
  .carb-badge {
    display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 5px;
    border: 0.5px solid var(--border); color: var(--text-muted); flex-shrink: 0;
  }
  .untried-badge {
    display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 5px;
    border: 0.5px solid var(--accent2); color: var(--accent2); flex-shrink: 0;
  }
  .legend-row { display: flex; gap: 16px; justify-content: center; padding: 2px 0 4px; }
  .legend-item { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .legend-label { font-size: 11px; color: var(--text-secondary); }
  .search-input {
    width: 100%; padding: 12px 14px; font-size: 14px; font-family: inherit;
    background: var(--surface); color: var(--text-primary);
    border: 0.5px solid var(--border); border-radius: 10px;
  }
  .search-input::placeholder { color: var(--text-muted); }
  .tab-row { display: flex; gap: 8px; }
  .tab-btn { flex: 1; padding: 10px 0; font-size: 13px; }
  .tab-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 9px 14px; font-size: 12px; border-radius: 20px; }
  .chip.active { background: var(--accent2-bg); color: var(--accent2); border-color: var(--accent2); font-weight: 600; }
  .filter-group { margin-top: 10px; }
  .filter-group-label { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
  .filter-reset { font-size: 12px; color: var(--text-secondary); padding: 6px 0; background: none; border: none; text-decoration: underline; }
  .badge-chip {
    display: inline-block; font-size: 11px; padding: 5px 12px; border-radius: 20px;
    border: 0.5px solid var(--border);
  }
  .badge-chip.earned { background: var(--accent2-bg); color: var(--accent2); border-color: var(--accent2); }
  .badge-chip.locked { color: var(--text-muted); }
  .badge-chip.rank-bronze.earned { background: rgba(176, 141, 87, 0.16); color: #cf9f6e; border-color: #b08d57; }
  .badge-chip.rank-silver.earned { background: rgba(201, 205, 212, 0.14); color: #d7dade; border-color: #9ea3ab; }
  .badge-chip.rank-gold.earned { background: var(--accent2-bg); color: var(--accent2); border-color: var(--accent2); box-shadow: 0 0 10px rgba(209, 163, 92, 0.35); }
  .rank-summary {
    display: inline-block; font-size: 11px; padding: 3px 10px; border-radius: 8px; margin-left: 8px;
  }
  .rank-summary.rank-見習い { color: var(--text-muted); border: 0.5px solid var(--border); }
  .rank-summary.rank-ブロンズ { color: #cf9f6e; border: 0.5px solid #b08d57; background: rgba(176, 141, 87, 0.14); }
  .rank-summary.rank-シルバー { color: #d7dade; border: 0.5px solid #9ea3ab; background: rgba(201, 205, 212, 0.12); }
  .rank-summary.rank-ゴールド { color: var(--accent2); border: 0.5px solid var(--accent2); background: var(--accent2-bg); box-shadow: 0 0 10px rgba(209, 163, 92, 0.35); }
  .diagnosis-card {
    background: var(--surface); border: 1px solid var(--accent2); border-radius: 14px;
    padding: 20px; text-align: center;
  }
  .diagnosis-label { font-size: 11px; color: var(--accent2); letter-spacing: 0.1em; margin-bottom: 10px; }
  .diagnosis-text { font-size: 15px; line-height: 1.8; margin-bottom: 16px; }
  .share-btn { width: 100%; padding: 12px 0; font-size: 13px; color: var(--accent2); border-color: var(--accent2); }
  .section-label { font-size: 11px; color: var(--text-muted); letter-spacing: 0.05em; margin-bottom: 2px; }
  .empty { text-align: center; color: var(--text-muted); font-size: 13px; padding: 30px 0; }
  .log-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 0.5px solid var(--border);
    width: 100%; text-align: left; background: none; border-left: none; border-right: none; border-top: none;
    border-radius: 0;
  }
  .log-row:last-child { border-bottom: none; }
  .log-row:hover { background: var(--surface-2); }
  .log-name { font-size: 14px; }
  .log-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .pref-pill { font-size: 11px; padding: 3px 9px; border-radius: 8px; background: var(--surface-2); color: var(--text-secondary); }
  .pref-pill.good { color: var(--accent2); background: var(--accent2-bg); }
  .primary-btn { width: 100%; padding: 17px; font-weight: 600; font-size: 15px; background: var(--accent); color: var(--bg); border: none; }
  .ghost-btn { width: 100%; padding: 10px; font-size: 12px; color: var(--text-muted); background: none; border: none; }
  .pref-row { display: flex; gap: 8px; }
  .pref-btn { flex: 1; padding: 12px 0; font-size: 13px; }
  .pref-btn.selected { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
  .err { color: #c96; font-size: 12px; }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  "use strict";

  /* ============================================================
     1. DATA — お酒マスターと質問セット。
     お酒を追加する時はDRINKSの配列に1件足すだけでよい書式にしてある。
     共通: { id, name, genre, tags, line, recipe, trivia, color, colorTo, look, glass, carbonated }
       id         : 一意なキー(英数字)
       genre      : cocktail / beer
       tags       : mood/sweetness/intensity(共通)+ジャンル固有タグ(ビールはbitterness)。各-2〜+2
       line       : 結果一覧に出す短いキャッチコピー
       recipe     : 構成・スペック(材料/分量、またはアルコール度数など)
       trivia     : 詳細画面で見せる豆知識(由来・トリビア)
       color/colorTo/look : 見た目の色見本と説明
       glass      : グラスの形。rock / highball / coupe / mug
       carbonated : 炭酸を使うか(true/false)
     カクテル固有: base(ジン/ウイスキー等。同ベース優先の並び替えに使用)
     ビール固有  : style(ラガー/IPA等。同スタイル優先の並び替えと表示ラベルに使用)
     ============================================================ */
  var DRINKS = [
    { id: "gin_tonic", name: "ジントニック", base: "gin", genre: "cocktail",
      tags: { mood: 1, sweetness: -1, intensity: -1 },
      line: "王道の軽やかさ。まず外さない一杯",
      recipe: "ジン45ml、トニックウォーター90ml、ライム",
      trivia: "起源はイギリス統治下のインド。マラリア予防薬キニーネの苦味をジンと炭酸で飲みやすくしたのが始まり",
      triviaLong: { origin: "起源はイギリス統治下のインドで、マラリア予防薬キニーネの苦味をジンと炭酸で飲みやすくしたのが始まりとされる。", variation: "レモンよりライムを使うのが伝統的なスタイルで、トニックウォーターの銘柄によっても風味が大きく変わる。", tip: "氷を先に入れてから炭酸をゆっくり注ぐと、泡が飛びにくく最後まで爽快な喉ごしを保てる。" },
      color: "#eef2ee", look: "無色透明。氷とライムがよく映える",
      glass: "highball", carbonated: true },
    { id: "gin_rickey", name: "ジンリッキー", base: "gin", genre: "cocktail",
      tags: { mood: -1, sweetness: -2, intensity: -1 },
      line: "静かに酔いたい夜向き。ドライで軽やか",
      recipe: "ジン45ml、ライムジュース15ml、ソーダ",
      trivia: "19世紀末、ワシントンD.C.のロビイストJoe Rickeyの名にちなむ。砂糖を使わない辛口が特徴",
      triviaLong: { origin: "19世紀末、ワシントンD.C.のロビイストJoe Rickeyの名にちなんで生まれた、砂糖を使わない辛口カクテル。", variation: "ベースの酒を変えても成立する懐の深いレシピで「ウイスキーリッキー」などの派生も存在する。", tip: "氷をたっぷり入れてグラスの温度を保つのが、最後まで薄まらず美味しく飲むコツ。" },
      color: "#eef2ee", look: "無色透明。見た目は水に近い軽さ",
      glass: "highball", carbonated: true },
    { id: "negroni", name: "ネグローニ", base: "gin", genre: "cocktail",
      tags: { mood: -1, sweetness: -1, intensity: 1 },
      line: "大人の苦味。落ち着いた雰囲気に合う",
      recipe: "ジン20ml、スウィートベルモット20ml、カンパリ20ml",
      trivia: "1919年、フィレンツェのネグローニ伯爵がカクテルの度数を上げてほしいと頼んだのが由来とされる",
      triviaLong: { origin: "1919年、フィレンツェのネグローニ伯爵がカクテルの度数を上げてほしいと頼んだのが由来とされる。", variation: "ジンを増やして辛口にする作り方や、プロセッコを加えた「ネグローニ・スバリアート」というバリエーションもある。", tip: "大きめの氷を1つだけ入れると、溶けるスピードが遅く最後まで味が崩れにくい。" },
      color: "#c1443a", look: "鮮やかな赤オレンジ。カンパリの色がそのまま出る",
      glass: "rock", carbonated: false },
    { id: "martini", name: "マティーニ", base: "gin", genre: "cocktail",
      tags: { mood: -2, sweetness: -2, intensity: 2 },
      line: "会話を止める一杯。多くを語らない強さ",
      recipe: "ジン45ml、ドライベルモット15ml、オリーブ",
      trivia: "「カクテルの王様」と呼ばれる。ジンとベルモットの比率は店ごとに流儀があり、注文時に会話のネタになる",
      triviaLong: { origin: "「カクテルの王様」と呼ばれる古典で、ジンとベルモットの比率は店ごとに流儀があり、注文時の会話のネタになる。", variation: "ベルモットを極限まで減らした「ドライマティーニ」、ウォッカ版の「ウォッカティーニ」など、呼び名だけで何種類もある。", tip: "グラスを事前にしっかり冷やしておくと、混ぜる時間を短縮でき水っぽくなりにくい。" },
      color: "#f0ecd9", look: "ほぼ透明の淡い黄色。逆三角のグラスが印象的",

    { id: "favorite_found", label: "推し発見", desc: "「好み」評価を3杯記録する", rank: "bronze", check: function (s) {
      return s.filter(function (log) { return log.preference === 3; }).length >= 3;
    }},
    { id: "repeater", label: "リピーター", desc: "同じお酒を3回記録する", rank: "silver", check: function (s) {
      var counts = {};
      s.forEach(function (log) { counts[log.drinkId] = (counts[log.drinkId] || 0) + 1; });
      for (var key in counts) { if (counts[key] >= 3) return true; }
      return false;
    }},
    { id: "glass_master", label: "グラス制覇", desc: "ロック/ハイボール/クープ/マグをすべて記録する", rank: "silver", check: function (s) {
      var glasses = {};
      s.forEach(function (log) {
        var d = DRINKS.find(function (x) { return x.id === log.drinkId; });
        if (d) glasses[d.glass] = true;
      });
      var allGlasses = {};
      DRINKS.forEach(function (d) { allGlasses[d.glass] = true; });
      return Object.keys(glasses).length >= Object.keys(allGlasses).length;
    }},
    { id: "carbonated_fan", label: "炭酸党", desc: "炭酸入りのお酒を5杯記録する", rank: "bronze", check: function (s) {
      return countMatchingDrinks(s, function (d) { return d.carbonated; }) >= 5;
    }},
    { id: "night_owl", label: "深夜の一杯", desc: "深夜0時〜4時に記録する", rank: "silver", check: function (s) {
      return s.some(function (log) {
        var h = new Date(log.timestamp).getHours();
        return h >= 0 && h < 4;
      });
    }}
  ];
  function countMatchingDrinks(s, predicate) {
    var count = 0;
    s.forEach(function (log) {
      var d = DRINKS.find(function (x) { return x.id === log.drinkId; });
      if (d && predicate(d)) count++;
    });
    return count;
  }
  function earnedBadgeIds(s) {
    var earned = {};
    BADGES.forEach(function (b) { if (b.check(s)) earned[b.id] = true; });
    return earned;
  }

  // ログイン中かつストックに無いお酒かどうか(未挑戦バッジの表示判定に使用)
  function isUntried(drinkId) {
    if (!currentUser) return false;
    return !stock.some(function (log) { return log.drinkId === drinkId; });
  }

  var RANK_LABEL = { bronze: "ブロンズ", silver: "シルバー", gold: "ゴールド" };
  // 獲得数から総合ランクを判定(全14個中)
  function overallRank(earnedCount) {
    if (earnedCount >= 12) return "ゴールド";
    if (earnedCount >= 9) return "シルバー";
    if (earnedCount >= 5) return "ブロンズ";
    return "見習い";
  }

  /* ============================================================
     3. SCORING
     ============================================================ */
  var NUMERIC_TAG_KEYS = ["mood", "sweetness", "intensity"];

  function computeResults(genre, answers) {
    var pool = DRINKS.filter(function (d) { return d.genre === genre; });
    var catKey = GENRES[genre].categoryKey; // カクテル:base / ビール:style
    var scored = pool.map(function (d) {
      var score = 0;
      NUMERIC_TAG_KEYS.forEach(function (key) {
        if (typeof answers[key] === "number") score += answers[key] * (d.tags[key] || 0);
      });
      if (catKey && answers[catKey] && d[catKey] === answers[catKey]) score += 3; // カテゴリ一致ボーナス
      return { drink: d, score: score, rand: Math.random() };
    });
    scored.sort(function (a, b) {
      if (b.score !== a.score) return b.score - a.score;
      return a.rand - b.rand; // 同点はランダムでタイブレーク
    });
    return scored.slice(0, 5).map(function (s) { return s.drink; });
  }

  // 同じジャンルの中から、カテゴリ軸(base/style)が同じものを優先し、足りない分は味が近い順に補う
  function relatedDrinks(d, limit) {
    limit = limit || 3;
    var sameGenre = DRINKS.filter(function (x) { return x.id !== d.id && x.genre === d.genre; });
    var catKey = GENRES[d.genre] && GENRES[d.genre].categoryKey;

    if (catKey) {
      var sameCat = sameGenre.filter(function (x) { return x[catKey] === d[catKey]; });
      sameCat.sort(function (a, b) { return tagDistance(a, d) - tagDistance(b, d); });
      if (sameCat.length >= limit) return sameCat.slice(0, limit);
      var others = sameGenre.filter(function (x) { return x[catKey] !== d[catKey]; });
      others.sort(function (a, b) { return tagDistance(a, d) - tagDistance(b, d); });
      return sameCat.concat(others).slice(0, limit);
    }

    sameGenre.sort(function (a, b) { return tagDistance(a, d) - tagDistance(b, d); });
    return sameGenre.slice(0, limit);
  }
  function tagDistance(a, b) {
    var sum = 0;
    NUMERIC_TAG_KEYS.forEach(function (key) {
      var diff = (a.tags[key] || 0) - (b.tags[key] || 0);
      sum += diff * diff;
    });
    return sum;
  }

  /* ============================================================
     4. APP STATE / ROUTER
     「戻る」がどの画面から来たかに関わらず正しく機能するよう、
     navigate()で画面遷移するたびに直前の状態をhistoryへ積み、
     goBack()でそれをポップして復元するシンプルな履歴スタック。
     ============================================================ */
  function emptyFilters() {
    return { intensity: [], sweetness: [], mood: [], base: [], carbonated: [] };
  }
  var state = { screen: "start", genre: "cocktail", registryGenre: "cocktail", answers: {}, qIndex: 0, results: [], detailId: null, pendingPref: null, searchText: "", filters: emptyFilters(), authMode: "login" };
  var history = [];

  function navigate(screen, patch) {
    history.push(Object.assign({}, state));
    state = Object.assign({}, state, { screen: screen }, patch || {});
    render();
  }

  function goBack() {
    state = history.length
      ? history.pop()
      : { screen: "start", genre: "cocktail", registryGenre: "cocktail", answers: {}, qIndex: 0, results: [], detailId: null, pendingPref: null, searchText: "", filters: emptyFilters(), authMode: "login" };
    render();
  }

  // 質問の回答から「診断結果」風の一文を組み立てる
  function diagnosisText(answers) {
    var mood = answers.mood || 0;
    var sweetness = answers.sweetness || 0;
    var intensity = answers.intensity || 0;
    var moodPhrase = mood < 0 ? "静かな夜" : mood > 0 ? "賑やかな夜" : "ほどよい夜";
    var tastePhrase = sweetness < 0 ? "ドライ" : sweetness > 0 ? "甘め" : "バランス型の甘さ";
    var bodyPhrase = intensity < 0 ? "軽やか" : intensity > 0 ? "コクのある" : "ちょうどいい飲みごたえ";
    var basePhrase = answers.base ? BASE_LABEL[answers.base] + "派" : "何でも派";
    return moodPhrase + "に、" + tastePhrase + "で" + bodyPhrase + "な一杯を選ぶ、" + basePhrase + "。";
  }

  function renderResults(root) {
    root.appendChild(topbar(true));

    var diagText = diagnosisText(state.answers);
    var diagCard = el(
      '<div class="diagnosis-card">' +
      '<div class="diagnosis-label">あなたの飲みタイプ</div>' +
      '<div class="diagnosis-text">' + diagText + "</div>" +
      '<button class="share-btn">この診断をシェア</button>' +
      "</div>"
    );
    var shareBtn = diagCard.querySelector(".share-btn");
    shareBtn.addEventListener("click", function () {
      var shareText = diagText + "\nおすすめは「" + (state.results[0] ? state.results[0].name : "") + "」でした。 #BARLOG";
      var shareUrl = (typeof location !== "undefined" && location.href) ? location.href : "";
      if (navigator.share) {
        navigator.share({ title: "BAR LOG診断", text: shareText, url: shareUrl }).catch(function () {});
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(shareText + " " + shareUrl).then(function () {
          var original = shareBtn.textContent;
          shareBtn.textContent = "コピーしました";
          setTimeout(function () { shareBtn.textContent = original; }, 1500);
        }).catch(function () {});
      }
    });
    root.appendChild(diagCard);

    root.appendChild(el('<h2 style="text-align:center;">今夜のおすすめ</h2>'));
    root.appendChild(el('<div class="result-tagline">あなたの好みに近い5杯</div>'));
    root.appendChild(glassLegend());

    var list = el('<div style="display:flex;flex-direction:column;gap:10px;"></div>');
    state.results.forEach(function (d, idx) {
      var card = el(
        '<button class="card drink-card' + (idx === 0 ? " best" : "") + '" style="text-align:left;width:100%;display:flex;align-items:center;gap:12px;">' +
        '<div class="swatch swatch-sm glass-' + d.glass + '" style="background:' + swatchBg(d) + ';"></div>' +
        '<div>' +
        (idx === 0 ? '<span class="badge">一番近い</span><br>' : "") +
        '<div class="drink-name">' + d.name +
        (d.carbonated ? ' <span class="carb-badge">炭酸</span>' : "") +
        (isUntried(d.id) ? ' <span class="untried-badge">未挑戦</span>' : "") + "</div>" +
        '<div class="drink-line">' + d.line + "</div></div>" +
        '<span class="row-arrow">&rsaquo;</span></button>'
      );
      card.addEventListener("click", function () { navigate("detail", { detailId: d.id, pendingPref: null }); });
      list.appendChild(card);
    });
    root.appendChild(list);
  }

  var TRAIT_AXES = [
    { key: "intensity", left: "軽やか", right: "コク・重厚" },
    { key: "sweetness", left: "辛口", right: "甘口" }
  ];
  var SCENE_AXES = [
    { key: "mood", left: "静か", right: "賑やか" }
  ];
  function combinedTraitsBox(d) {
    var wrap = el('<div class="info-box" style="border-left:3px solid ' + d.color + ';"></div>');
    function section(label, axes) {
      wrap.appendChild(el('<div class="info-label">' + label + "</div>"));
      axes.forEach(function (axis) {
        var value = d.tags[axis.key] || 0;
        var percent = ((value + 2) / 4) * 100;
        wrap.appendChild(el(
          '<div class="trait-row">' +
          '<div class="trait-labels"><span>' + axis.left + '</span><span>' + axis.right + "</span></div>" +
          '<div class="trait-track"><div class="trait-dot" style="left:' + percent + '%;background:' + d.color + ';"></div></div>' +
          "</div>"
        ));
      });
    }
    section("特徴", TRAIT_AXES);
    wrap.appendChild(el('<div class="trait-divider"></div>'));
    section("似合うシーン", SCENE_AXES);
    return wrap;
  }

  function renderDetail(root) {
    root.appendChild(topbar(true));
    var d = DRINKS.find(function (x) { return x.id === state.detailId; });

    root.style.backgroundImage =
      "radial-gradient(ellipse 120% 480px at 50% 0%, " + hexToRgba(d.color, 0.32) + ", " +
      hexToRgba(d.color, 0.08) + " 55%, transparent 85%)";
    root.style.marginTop = "-24px";
    root.style.paddingTop = "24px";

    root.appendChild(el('<h2 style="text-align:center;">' + d.name + "</h2>"));
    root.appendChild(el(
      '<div class="result-tagline">' + subLabel(d) + " ・ " + d.line +
      (d.carbonated ? ' <span class="carb-badge">炭酸あり</span>' : "") + "</div>"
    ));

    root.appendChild(combinedTraitsBox(d));
    root.appendChild(el(
      '<div class="info-box" style="display:flex;align-items:center;gap:16px;border-left:3px solid ' + d.color + ';">' +
      '<div class="swatch swatch-lg glass-' + d.glass + '" style="background:' + swatchBg(d) + ';"></div>' +
      '<div><div class="info-label">見た目</div>' + d.look + "</div></div>"
    ));
    root.appendChild(el(
      '<div class="info-box" style="border-left:3px solid ' + d.color + ';"><div class="info-label">' + infoLabel1(d) + "</div>" + d.recipe + "</div>"
    ));
    var triviaBox = el(
      '<div class="trivia-quote" style="border-left-color:' + d.color + ';"><div class="info-label">豆知識</div>' + d.trivia + "</div>"
    );
    root.appendChild(triviaBox);

    if (d.triviaLong) {
      var moreToggle = el('<button class="more-toggle">もっと知る &darr;</button>');
      var moreBox = null;
      moreToggle.addEventListener("click", function () {
        if (moreBox) {
          moreBox.remove();
          moreBox = null;
          moreToggle.innerHTML = "もっと知る &darr;";
        } else {
          moreBox = el(
            '<div class="info-box" style="margin-top:8px;border-left:3px solid ' + d.color + ';">' +
            '<div class="trivia-section"><div class="trivia-section-label">由来</div>' + d.triviaLong.origin + "</div>" +
            '<div class="trivia-section"><div class="trivia-section-label">バリエーション</div>' + d.triviaLong.variation + "</div>" +
            '<div class="trivia-section"><div class="trivia-section-label">飲み方のこだわり</div>' + d.triviaLong.tip + "</div>" +
            "</div>"
          );
          moreToggle.after(moreBox);
          moreToggle.innerHTML = "閉じる &uarr;";
        }
      });
      root.appendChild(moreToggle);
    }

    root.appendChild(el(
      '<div class="section-label">' + (d.genre === "cocktail" ? "同じベースのお酒" : "同じスタイルのお酒") + "</div>"
    ));
    var chipRow = el('<div class="chip-row"></div>');
    relatedDrinks(d).forEach(function (sim) {
      var chip = el('<button class="chip">' + sim.name + "</button>");
      chip.addEventListener("click", function () { navigate("detail", { detailId: sim.id, pendingPref: null }); });
      chipRow.appendChild(chip);
    });
    root.appendChild(chipRow);

    if (currentUser) {
      var prefRow = el('<div class="pref-row"></div>');
      [3, 2, 1].forEach(function (v) {
        var b = el('<button class="pref-btn' + (state.pendingPref === v ? " selected" : "") + '">' + PREF_LABEL[v] + "</button>");
        b.addEventListener("click", function () { state.pendingPref = v; render(); });
        prefRow.appendChild(b);
      });
      root.appendChild(prefRow);

      var errBox = el('<div class="err" style="text-align:center;min-height:14px;"></div>');
      root.appendChild(errBox);

      var saveBtn = el('<button class="primary-btn">飲んだ</button>');
      saveBtn.addEventListener("click", async function () {
        if (!state.pendingPref) {
          errBox.textContent = "好みを選んでください";
          return;
        }
        saveBtn.disabled = true;
        saveBtn.textContent = "記録中...";
        var userRes = await supabaseClient.auth.getUser();
        var user = userRes.data && userRes.data.user;
        if (!user) {
          errBox.textContent = "セッションが切れました。再度ログインしてください";
          saveBtn.disabled = false;
          saveBtn.textContent = "飲んだ";
          return;
        }
        var insertRes = await supabaseClient.from("logs").insert({
          user_id: user.id, drink_id: d.id, preference: state.pendingPref
        });
        if (insertRes.error) {
          errBox.textContent = "保存に失敗しました。もう一度お試しください";
          saveBtn.disabled = false;
          saveBtn.textContent = "飲んだ";
          return;
        }
        stock.push({ drinkId: d.id, timestamp: new Date().toISOString(), preference: state.pendingPref });
        navigate("stock");
      });
      root.appendChild(saveBtn);

      // キャンセル導線:記録せず、来た画面に戻る
      var cancelBtn = el('<button class="ghost-btn">やめる</button>');
      cancelBtn.addEventListener("click", goBack);
      root.appendChild(cancelBtn);
    } else {
      root.appendChild(el(
        '<div class="info-box" style="text-align:center;">' +
        '<div class="info-label">記録</div>' +
        '<div style="font-size:13px;color:var(--text-secondary);">ログインすると、飲んだ記録を保存できます</div></div>'
      ));
      var loginBtn = el('<button class="primary-btn">ログインする</button>');
      loginBtn.addEventListener("click", function () { navigate("auth"); });
      root.appendChild(loginBtn);

      var backBtn = el('<button class="ghost-btn">戻る</button>');
      backBtn.addEventListener("click", goBack);
      root.appendChild(backBtn);
    }
  }

  // 登録一覧の絞り込み設定。数値タグは-1(低め)/0(普通)/1(高め)の3バケットに丸めて比較する
  var FILTER_GROUPS = [
    { key: "intensity", label: "コクの強さ", options: [
      { value: -1, label: "軽やか" }, { value: 0, label: "普通" }, { value: 1, label: "コク・重厚" }
    ]},
    { key: "sweetness", label: "甘辛", options: [
      { value: -1, label: "辛口" }, { value: 0, label: "普通" }, { value: 1, label: "甘口" }
    ]},
    { key: "mood", label: "似合うシーン", options: [
      { value: -1, label: "静か" }, { value: 0, label: "普通" }, { value: 1, label: "賑やか" }
    ]},
    { key: "base", label: "ベース", options: [
      { value: "gin", label: "ジン" }, { value: "whiskey", label: "ウイスキー" }, { value: "rum", label: "ラム" },
      { value: "vodka", label: "ウォッカ" }, { value: "tequila", label: "テキーラ" }, { value: "liqueur", label: "リキュール" },
      { value: "other", label: "その他" }
    ]},
    { key: "carbonated", label: "炭酸", options: [
      { value: true, label: "炭酸あり" }, { value: false, label: "炭酸なし" }
    ]}
  ];
  function bucket(value) { return value < 0 ? -1 : (value > 0 ? 1 : 0); }
  function matchesFilters(d, filters) {
    return FILTER_GROUPS.every(function (group) {
      var selected = filters[group.key];
      if (!selected.length) return true;
      var actual = group.key === "intensity" || group.key === "sweetness" || group.key === "mood"
        ? bucket(d.tags[group.key] || 0)
        : d[group.key];
      return selected.indexOf(actual) !== -1;
    });
  }

  function renderRegistry(root) {
    root.appendChild(topbar(true));
    root.appendChild(el('<h2 style="text-align:center;">登録一覧</h2>'));

    var genreKeys = Object.keys(GENRES);
    if (genreKeys.length > 1) {
      var tabRow = el('<div class="tab-row"></div>');
      genreKeys.forEach(function (key) {
        var tab = el(
          '<button class="tab-btn' + (state.registryGenre === key ? " active" : "") + '">' + GENRES[key].label + "</button>"
        );
        tab.addEventListener("click", function () { state.registryGenre = key; render(); });
        tabRow.appendChild(tab);
      });
      root.appendChild(tabRow);
    }

    var input = el('<input class="search-input" type="text" placeholder="お酒の名前で検索" />');
    input.value = state.searchText;
    root.appendChild(input);

    var filterHeaderRow = el('<div style="display:flex;justify-content:flex-end;"></div>');
    var resetBtn = el('<button class="filter-reset">絞り込みをリセット</button>');
    resetBtn.addEventListener("click", function () { state.filters = emptyFilters(); render(); });
    filterHeaderRow.appendChild(resetBtn);
    root.appendChild(filterHeaderRow);

    FILTER_GROUPS.forEach(function (group) {
      var groupEl = el('<div class="filter-group"></div>');
      groupEl.appendChild(el('<div class="filter-group-label">' + group.label + "</div>"));
      var chipRow = el('<div class="chip-row"></div>');
      group.options.forEach(function (opt) {
        var isActive = state.filters[group.key].indexOf(opt.value) !== -1;
        var chip = el('<button class="chip' + (isActive ? " active" : "") + '">' + opt.label + "</button>");
        chip.addEventListener("click", function () {
          var list = state.filters[group.key];
          var i = list.indexOf(opt.value);
          if (i === -1) list.push(opt.value); else list.splice(i, 1);
          render();
        });
        chipRow.appendChild(chip);
      });
      groupEl.appendChild(chipRow);
      root.appendChild(groupEl);
    });

    var listWrap = el('<div></div>');
    root.appendChild(listWrap);

    function renderList() {
      listWrap.innerHTML = "";
      var q = state.searchText.trim();
      var filtered = DRINKS.filter(function (d) {
        return d.genre === state.registryGenre && (!q || d.name.indexOf(q) !== -1) && matchesFilters(d, state.filters);
      });

      if (!filtered.length) {
        listWrap.appendChild(el('<div class="card empty">該当するお酒がありません</div>'));
        return;
      }

      var card = el('<div class="card"></div>');
      filtered.forEach(function (d) {
        var row = el(
          '<button class="log-row"><div style="display:flex;align-items:center;gap:10px;">' +
          '<div class="swatch swatch-sm glass-' + d.glass + '" style="background:' + swatchBg(d) + ';"></div>' +
          '<div><div class="log-name">' + d.name +
          (d.carbonated ? ' <span class="carb-badge">炭酸</span>' : "") +
          (isUntried(d.id) ? ' <span class="untried-badge">未挑戦</span>' : "") + "</div>" +
          '<div class="log-meta">' + subLabel(d) + "</div></div></div>" +
          '<span class="row-arrow">&rsaquo;</span></button>'
        );
        row.addEventListener("click", function () { navigate("detail", { detailId: d.id, pendingPref: null }); });
        card.appendChild(row);
      });
      listWrap.appendChild(card);
    }

    input.addEventListener("input", function () {
      state.searchText = input.value;
      renderList();
    });

    renderList();
  }

  function renderStock(root) {
    root.appendChild(topbar(true));
    root.appendChild(el('<h2 style="text-align:center;">ストック</h2>'));

    if (!stock.length) {
      if (currentUser) {
        root.appendChild(el('<div class="card empty">まだ記録がありません</div>'));
      } else {
        root.appendChild(el('<div class="card empty">ログインすると記録を保存できます</div>'));
        var loginBtn = el('<button class="primary-btn" style="margin-top:10px;">ログインする</button>');
        loginBtn.addEventListener("click", function () { navigate("auth"); });
        root.appendChild(loginBtn);
      }
      return;
    }

    root.appendChild(glassLegend());

    var card = el('<div class="card"></div>');
    var sorted = stock.slice().reverse();
    sorted.forEach(function (log) {
      var d = DRINKS.find(function (x) { return x.id === log.drinkId; });
      var date = new Date(log.timestamp);
      var dateStr = (date.getMonth() + 1) + "/" + date.getDate();
      var row = el(
        '<button class="log-row"><div style="display:flex;align-items:center;gap:10px;">' +
        (d ? '<div class="swatch swatch-sm glass-' + d.glass + '" style="background:' + swatchBg(d) + ';"></div>' : "") +
        '<div><div class="log-name">' + (d ? d.name : "不明") + (d && d.carbonated ? ' <span class="carb-badge">炭酸</span>' : "") + "</div>" +
        '<div class="log-meta">' + dateStr + "</div></div></div>" +
        '<div style="display:flex;align-items:center;gap:8px;">' +
        '<span class="pref-pill' + (log.preference === 3 ? " good" : "") + '">' + PREF_LABEL[log.preference] + "</span>" +
        '<span class="row-arrow">&rsaquo;</span></div></button>'
      );
      if (d) {
        row.addEventListener("click", function () { navigate("detail", { detailId: d.id, pendingPref: null }); });
      }
      card.appendChild(row);
    });
    root.appendChild(card);
  }

  /* ============================================================
     7. MAIN RENDER
     ============================================================ */
  function render() {
    var app = document.getElementById("app");
    app.innerHTML = "";
    var root = el('<div class="screen"></div>');
    app.appendChild(root);
    if (state.screen === "auth") renderAuth(root);
    else if (state.screen === "newPassword") renderNewPassword(root);
    else if (state.screen === "start") renderStart(root);
    else if (state.screen === "badges") renderBadges(root);
    else if (state.screen === "genreSelect") renderGenreSelect(root);
    else if (state.screen === "question") renderQuestion(root);
    else if (state.screen === "results") renderResults(root);
    else if (state.screen === "detail") renderDetail(root);
    else if (state.screen === "registry") renderRegistry(root);
    else if (state.screen === "stock") renderStock(root);
  }

  // 起動時にログイン済みかどうかを確認し、画面を出し分ける
  async function boot() {
    try {
      var sessionRes = await supabaseClient.auth.getSession();
      if (sessionRes.data && sessionRes.data.session) {
        currentUser = sessionRes.data.session.user;
        await loadStockFromServer();
      } else {
        currentUser = null;
      }
    } catch (e) {
      currentUser = null;
    }
    state.screen = "start";
    render();
  }

  // ログアウトしたら、ストックをクリアしてスタート画面に戻す(ログイン画面は強制しない)
  supabaseClient.auth.onAuthStateChange(function (event, session) {
    if (event === "SIGNED_OUT") {
      currentUser = null;
      stock = [];
      history = [];
      state = { screen: "start", genre: "cocktail", registryGenre: "cocktail", answers: {}, qIndex: 0, results: [], detailId: null, pendingPref: null, searchText: "", filters: emptyFilters(), authMode: "login" };
      render();
    } else if (event === "SIGNED_IN" && session) {
      currentUser = session.user;
    } else if (event === "PASSWORD_RECOVERY") {
      history = [];
      navigate("newPassword");
    }
  });

  boot();
})();
</script>
</body>
</html>
